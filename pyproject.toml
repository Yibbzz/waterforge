[project]
name = "waterforge"
version = "0.1.0.dev0"
description = "Check drinking water network GIS data against network rules and turn it into an EPANET model, with EPANET as the referee"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["water", "epanet", "utility network", "gis", "hydraulic model", "validation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
]

# Lower bounds are the APIs the code relies on (shapely 2 vectorised
# functions, geopandas 1). owa-epanet is pinned: EPANET is the referee,
# and an upgrade is a deliberate step with the agreement tests re-run
# (decided 2026-10-27, see CLAUDE.md).
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "scipy>=1.11",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "owa-epanet==2.3.5",
]

[project.scripts]
waterforge = "waterforge.cli:main"

[project.urls]
Homepage = "https://github.com/Yibbzz/waterforge"
Documentation = "https://github.com/Yibbzz/waterforge/blob/main/docs/rules.md"
Issues = "https://github.com/Yibbzz/waterforge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterforge"]

[tool.hatch.build.targets.sdist]
include = ["src/waterforge", "tests", "docs", "examples", "README.md", "LICENSE",
           "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
markers = [
    "realdata: runs on whole cities' open data (needs WATERFORGE_DATA; see tests/realdata)",
]
addopts = "-m 'not realdata'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
# zip() without strict= is fine here: the arrays come from the same table.
ignore = ["B905"]

[tool.coverage.run]
source = ["waterforge"]
branch = true

[tool.coverage.report]
show_missing = true
# CI fails below this. Raise it as tests grow.
fail_under = 85
