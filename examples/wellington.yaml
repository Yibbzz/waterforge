# WaterForge field mapping: Wellington City water supply, Wellington Water open data.
# Data: https://data-wellingtonwater.opendata.arcgis.com/ (EPSG:2193), exported weekly
# from InfoNet. Credit Wellington Water; not for commercial use or detailed design.
# Pipes record the asset at each end (start_node_id / end_node_id), so the node-id
# rules (WG-14, WG-15) run too.

pipes:
  - layer: pipes
    # mains only: service connections, fire services and discharge pipes left out
    where: >-
      TRIM(operational_status) = 'In Use'
      AND pipe_type IN ('Main', 'RIderMain', 'Trunk Main', 'Transmission Main')
    id: asset_id
    diameter: diameter_mm
    material: material
    start_node: start_node_id
    end_node: end_node_id
    class:                       # for the connection table (WG-18)
      field: pipe_type
      values: {Main: distribution, RIderMain: rider, Trunk Main: trunk,
               Transmission Main: trunk}

customers:
  # each service connection is one property, at the junction nearest its end on the main.
  # Wellington's homes aren't metered, so there is no measured demand per property: each
  # gets the same share of the city's total (settings.total_demand below).
  - layer: pipes
    where: >-
      TRIM(operational_status) = 'In Use'
      AND pipe_type IN ('Service Connection', 'Household Connection')
    id: asset_id

fittings:
  - layer: fittings
    where: "TRIM(operational_status) = 'In Use'"
    id: asset_id
    elevation: elevation_m       # ground level at the node: used at the Solves level
    type:
      field: type
      values: {Dead End: end cap, Tee: tee, Joint: joint, Bend: bend, Reducer: reducer,
               Flexible Joint: joint, Tapping Band: tapping band}
      default: other

valves:
  - layer: valves
    where: "TRIM(operational_status) = 'In Use'"
    id: asset_id
    closed: {field: valve_status, values: [Closed]}

hydrants:
  - layer: hydrants
    where: "TRIM(operational_status) = 'In Use'"
    id: asset_id
    elevation: elevation_m

structures:
  - layer: tanks
    where: "TRIM(operational_status) = 'In Use'"
    id: asset_id
    type:
      field: type
      values: {Reservoir: reservoir, TANK: tank}
      default: other              # EMTK: emergency tanks, not a supply source
    head: twl_m                  # top water level, m above datum (checked against the
                                 # ground beside each tank); empty for about half the tanks
  - layer: pump_stations
    where: "TRIM(operational_status) = 'In Use'"
    id: asset_id
    type: pump station

# Which assets must never meet (WG-18). A starting point, not Wellington Water's own
# policy: confirm it with them or a modeller.
connections:
  - never: [trunk, hydrant]          # hydrants go on distribution and rider mains
  - never: [trunk, customer]         # no property service straight off a trunk main
  - never: [trunk, rider]            # a rider main is fed from distribution mains
  - never: [trunk, distribution]     # trunk to distribution only through a valve
    unless: valve

settings:
  # Wellington City's total supply, 2024/25: Wellington Water's "2024/25 Council Water
  # Loss and Demand Overview" gives the city's water loss as 18.7 ML/day, 23% of its
  # demand, so total demand (use plus loss) is about 18.7 / 0.23 = 81.3 ML/day = 941 L/s.
  # It matches the council's "about 30 million m3 a year". Leakage included, spread like
  # the use. https://www.wellingtonwater.co.nz/assets/Reports-and-Publications/202425-WCC-Water-Loss-Overview.pdf
  total_demand: 941
