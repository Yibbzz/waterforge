# WaterForge field mapping: Townsville City Council water supply open data (CC BY 4.0).
# Data: https://data-tsvcitycouncil.opendata.arcgis.com/ (EPSG:7855). Download the
# layers into one GeoPackage with these layer names (see tests/realdata/README.md).
# Type codes come from each ArcGIS layer's `types` (e.g. fittings 3103 = end cap).

pipes:
  - layer: mains
    where: "NOTINUSE = 'N' OR NOTINUSE IS NULL"
    id: ASSET_NUMBER
    diameter: PIPE_SIZE          # text, e.g. "150" or "1000+"
    material: PIPE_MAT
    class:                       # the layer's types (for the connection table, WG-18)
      field: WATERLINETYPE
      values: {101: raw, 102: distribution, 103: trunk, 104: reticulation}

fittings:
  - layer: fittings
    where: "NOTINUSE = 'N' OR NOTINUSE IS NULL"
    id: ASSET_NUMBER
    type:
      field: USER_TYPE
      values: {3103: end cap, 3101: tee, 3102: cross, 3108: joint, 3123: joint,
               3151: tapping band}
      default: other

valves:
  - layer: system_valves
    where: "NOTINUSE = 'N' OR NOTINUSE IS NULL"
    id: ASSET_NUMBER
    closed: {field: NORMALPOSITION, values: [0]}
  - layer: control_valves
    where: "NOTINUSE = 'N' OR NOTINUSE IS NULL"
    id: ASSET_NUMBER

hydrants:
  - layer: hydrants
    where: "NOTINUSE = 'N' OR NOTINUSE IS NULL"
    id: ASSET_NUMBER

structures:
  - layer: structures
    where: "NOTINUSE = 'N' OR NOTINUSE IS NULL"
    id: ASSET_NUMBER
    type:
      field: DESCRIPT
      values: {RESERVOIR: reservoir, WATER_TANK: tank, WATER_TOWER: tank,
               BOOSTER_PUMP: pump station}
      default: other

# Which assets must never meet (WG-18). A starting point, not the council's own policy:
# confirm it with them or a modeller.
connections:
  - never: [raw, reticulation]       # untreated water never joins treated mains
  - never: [raw, distribution]
  - never: [raw, trunk]
  - never: [raw, hydrant]
  - never: [trunk, hydrant]          # hydrants go on reticulation and distribution mains
  - never: [trunk, reticulation]     # trunk to reticulation only through a valve
    unless: valve

settings:
  # Townsville's metered consumption, 2024/25: 37,387,870 kL over the four quarters
  # (Townsville City Council Water Consumption, data.gov.au, CC BY 4.0) = 1,186 L/s.
  # Metered use only: leakage isn't in it. No customers layer is mapped, so it is spread
  # evenly over the junctions. https://data.gov.au/data/dataset/tcc-water-consumption
  total_demand: 1186
